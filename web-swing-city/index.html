  var images = {};
  function loadImage(file) {
    if (!file) return null;
    if (images[file]) return images[file];
    var img = new Image();
    var entry = { img: img, ok: false };
    img.onload = function () { entry.ok = img.naturalWidth > 0; };
    img.onerror = function () { entry.ok = false; };
    var inline = window.INLINE_ASSETS && window.INLINE_ASSETS[file];
    img.src = inline || file;
    images[file] = entry;
    return entry;
  }
  function getImage(file) { var e = file && images[file]; return e && e.ok ? e.img : null; }

  }

  function makeBuilding(x, w, h) {
    return { x: x, w: w, top: GROUND_Y - h, color: BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)], seed: Math.random() * 1000 };
  }

  function insideBuilding(x, y, pad) {
    for (var i = 0; i < world.buildings.length; i++) {
      var b = world.buildings[i];
      if (x > b.x - pad && x < b.x + b.w + pad && y > b.top - pad) return true;
    }
    return y > GROUND_Y - 60;
  }

  function nearAnchor(x, y, dist) {
    for (var i = 0; i < world.anchors.length; i++) {
      var a = world.anchors[i];
      if (Math.abs(a.x - x) < dist && Math.abs(a.y - y) < dist) return true;
    }
    return false;
  }

  function extendWorld(toX) {
    while (world.nextBuildingX < toX + 600) {
      var d = difficulty(world.nextBuildingX);
      var w = rand(130 - d * 20, 260 - d * 60);
      var h = rand(150, 370);
      var nb = makeBuilding(world.nextBuildingX, w, h);
      world.buildings.push(nb);
      placeRescueStuff(nb);
      // gaps get wider the further you go
      world.nextBuildingX += w + rand(70 + d * 170, 190 + d * 280);
    }
    while (world.nextAnchorX < toX) {
      var x = world.nextAnchorX, d2 = difficulty(x);
      var a = { x: x, y: GROUND_Y - rand(440, 610), bob: Math.random() * 6.28 };
      world.anchors.push(a);
      // stars along the swing path under this anchor
      if (Math.random() < 0.75) {
        var r = rand(230, 300), n = 3 + Math.floor(Math.random() * 3);
        for (var i = 0; i < n; i++) {
          var th = (-0.7 + 1.4 * (i + 0.5) / n);
          var sx = a.x + Math.sin(th) * r, sy = a.y + Math.cos(th) * r;
          if (!insideBuilding(sx, sy, 25)) world.stars.push({ x: sx, y: sy, spin: Math.random() * 6 });
        }
      }
      if (x > world.nextBoostX) {
        world.pickups.push({ type: 'boost', x: a.x + 40, y: a.y + 230, t: 0 });
        world.nextBoostX = x + rand(2600, 4200);
      } else if (x > world.nextShieldX) {
        world.pickups.push({ type: Math.random() < 0.5 ? 'heart' : 'shield', x: a.x + 30, y: a.y + 210, t: 0 });
        world.nextShieldX = x + rand(5000, 8000);
      }
      // anchors get further apart over distance
      world.nextAnchorX += Math.min(TUNING.maxAnchorGap, rand(200 + d2 * 70, 280 + d2 * 100));
    }
    while (world.nextHazardX < toX) {
      var hx = world.nextHazardX, d3 = difficulty(hx);
      if (world.finalBoss || (hx > world.nextFinalBossX - 600 && hx < world.nextFinalBossX + 400)) { world.nextHazardX += 800; continue; }
      var hy = GROUND_Y - rand(240, 470);
      if (world.crab || game.goalDone) { world.nextHazardX += 800; continue; }
      var elist = enemyList(hx), etype = elist.length ? elist[Math.floor(Math.random() * elist.length)] : null;
      if (etype && (etype === 'runner' || (!insideBuilding(hx, hy, 40) && !nearAnchor(hx, hy, 90)))) spawnEnemy(etype, hx, hy);
      world.nextHazardX += rand(1700 - d3 * 1000, 2500 - d3 * 1400) / (game.level && game.level.density ? game.level.density : 1);
    }
  }

  function pruneWorld(fromX) {
    function ahead(o) { return o.x > fromX; }
    world.buildings = world.buildings.filter(function (b) { return b.x + b.w > fromX; });
    world.anchors = world.anchors.filter(function (a) { return a.x > fromX || (hero.rope && hero.rope.anchor === a); });
    world.stars = world.stars.filter(ahead);
    world.pickups = world.pickups.filter(ahead);
    world.hazards = world.hazards.filter(ahead);
    world.citizens = world.citizens.filter(function (c) { return c.state === 'carried' || c.x > fromX; });
  }

  function stepBoss(dt) {
    var b = world.boss;
    if (!b) {
      if (game.state === 'play' && hero.x > world.nextBossX && !world.finalBoss && !world.crab && !game.goalDone && hero.x < world.nextFinalBossX - 3000) {
        world.boss = { x: hero.x - viewW * 0.5 - 150, y: hero.y - 60, t: 0, r: 58, leaving: false, hitCool: 0, hp: 6, flash: 0 };
        var vil = !game.level && villain;   // a drawn villain replaces Big Bot in Endless
        banner((vil ? villain.name.toUpperCase() : 'BIG BOT') + ' IS CHASING YOU!', '#ff3b3b');
        if (vil) { game.bossTalk = { text: 'I am ' + villain.name + '! Come back here!', life: 2.6 }; speak(game.bossTalk.text, villain.voice); }
        else say('boss', true);
        shake(0.5, 8);
        sfx('boss');
      }
      return;
    }
    b.t += dt;
    if (b.hitCool > 0) b.hitCool -= dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.leaving || game.state !== 'play') {
      b.y -= 500 * dt; b.x += 300 * dt;
      if (b.y < cam.y - 300) world.boss = null;
      return;
    }
    var d = difficulty(hero.x);
    b.x += (TUNING.bossSpeed + d * 120) * dt;
    b.x = Math.max(b.x, hero.x - viewW * 0.5 - 150);       // never falls too far behind
    b.y += (clamp(hero.y, GROUND_Y - 650, GROUND_Y - 140) - b.y) * Math.min(1, dt * 1.6);
    if (b.t > TUNING.bossTime) {
      b.leaving = true; game.bigbotDone = true;
      medal('bigbot');
      hero.bonus += 50;
      banner('YOU ESCAPED BIG BOT! +50', '#ffd23f');
      sfx('shield');
      world.nextBossX = hero.x + TUNING.bossEvery;
    }
  }

  function stepWorld(dt) {
    var hz = dt * (game.state === 'play' ? diffCfg().speed : 1);   // Easy = slower enemies & shots, Hard = faster
    stepBoss(hz);
    stepFinalBoss(hz);
    stepCrab(hz);
    stepBolts(hz);
    stepWebBalls(dt);
    stepCitizens(dt);
    stepBuddy(dt);
    world.hazards.forEach(function (h) {
      if (h.webbed) { stepWebbed(h, dt); return; }   // wrapped up in web
      h.t += hz;
      if (h.type === 'drone') { h.y = h.baseY + Math.sin(h.t * 2) * 45; }
      else if (h.type === 'bird') { h.x -= h.speed * hz; h.y = h.baseY + Math.sin(h.t * 3) * 25; }
      else stepEnemy(h, hz);
    });
    world.hazards = world.hazards.filter(function (h) { return !h.dead; });
  }

  /* =====================================================================
   * 5. HERO
   * =================================================================== */
  var hero = {};
  function resetHero(startX) {
    hero.x = startX || 0; hero.y = world.buildings[0].top - TUNING.heroRadius;
    hero.vx = TUNING.runSpeed; hero.vy = 0;
    hero.rope = null; hero.flying = false; hero.fuel = 1; hero.charmT = 0;
    hero.onRoof = true;
    hero.climbing = null;
    hero.angle = 0;
    hero.maxX = hero.x;
    hero.runPhase = 0;
    hero.trail = [];          // recent positions for the trail effect
    hero.spin = 0; hero.spinAcc = 0; hero.spinRate = 0; hero.flipping = false; hero.flipDir = 1;
    hero.stretch = 0; hero.squash = 0;
    hero.mult = 1; hero.multTime = 0;  // style multiplier meter
    hero.ammo = TUNING.ammo; hero.fireCool = 0;
    hero.streak = 0;          // stars grabbed in quick succession
    hero.streakTime = 0;
    hero.hearts = maxHearts();
    hero.shield = false;
    hero.hurt = 0;            // blink timer after a hit
    hero.boost = 0;           // speed boost timer
    hero.stars = 0;
    hero.bonus = 0;           // style points
    hero.combo = 0;           // webs in a row without touching a roof
    hero.airborne = false;
    hero.zip = null; hero.powerCool = 0; hero.webShield = 0; hero.senseCool = 0; hero.senseT = 0;
    hero.charging = false; hero.chargeT = 0; hero.roll = 0; hero.carry = null; hero.climbSide = 1; hero.climbV = 0;
  }

  function findAnchor() {
    var best = null, bestScore = Infinity;
    var tx = hero.x + 210, ty = hero.y - 260;
    for (var i = 0; i < world.anchors.length; i++) {
      var a = world.anchors[i];
      if (a.x < hero.x - 30 || a.y > hero.y - 30) continue;
      var dx = a.x - hero.x, dy = a.y - hero.y;
      if (dx * dx + dy * dy > TUNING.maxRopeLength * TUNING.maxRopeLength) continue;
      var sx = a.x - tx, sy = a.y - ty;
      var score = sx * sx + sy * sy;
      if (score < bestScore) { bestScore = score; best = a; }
    }
    return best;
  }

  function shootWeb() {
    if (hero.rope) return true;
    if (hero.flying) return false;   // while flying, holding = fly up
    var a = findAnchor();
    if (!a) return false;
    var len = Math.hypot(a.x - hero.x, a.y - hero.y);
    var phi = Math.atan2(hero.x - a.x, hero.y - a.y);
    hero.rope = { anchor: a, length: clamp(len, TUNING.minRopeLength, TUNING.maxRopeLength), age: 0, sweep: 0, lastAng: phi, kicked: false };
    endFlip();
    if (hero.airborne) {
      hero.combo++;
      if (hero.combo >= 2) {
        trick(hero.combo * 5, 'COMBO x' + hero.combo, '#7df9ff');
        if (hero.combo === 3 || hero.combo === 6) say('combo');
      }
    }
    hero.climbing = null;
    hero.onRoof = false;
    shake(0.06, 2);
    sfx('thwip');
    return true;
  }

  function releaseWeb() {
    if (!hero.rope) return;
    var a = hero.rope.anchor;
    var phi = Math.atan2(hero.x - a.x, hero.y - a.y);   // 0 = right under the anchor, + = in front
    var sp = Math.hypot(hero.vx, hero.vy);
    var bigSwing = hero.rope.sweep > 2.2;
    hero.rope = null;
    hero.airborne = true;
    // launch: faster swings throw you higher
    hero.vy -= TUNING.releaseHop + sp * 0.1;
    if (hero.vx > 0) hero.vx += TUNING.releaseBoost;
    hero.stretch = 1;
    // PERFECT release: let go on the way up, in front of the anchor
    if (phi > 0.45 && phi < 1.25 && hero.vx > 0 && hero.vy < 0 && sp > 420) {
      hero.vx *= 1.12; hero.vy -= 110;
      game.slowmo = TUNING.slowmo;
      game.stats.perfect++;
      if (game.stats.perfect >= 5) medal('perfect5');
      trick(15, 'PERFECT!', '#3ddc84');
      sfx('perfect');
      burst(hero.x, hero.y, '#3ddc84', 14);
    } else if (bigSwing) {
      trick(20, 'BIG SWING!', '#ffd23f');
      say('swing');
    }
    // fast enough? start flipping!
    sp = Math.hypot(hero.vx, hero.vy);
    if (sp > TUNING.flipSpeed) {
      hero.flipDir = hero.vx >= 0 ? 1 : -1;
      hero.spinRate = Math.min(24, 13 + (sp - TUNING.flipSpeed) / 55);
      hero.spinAcc = 0;
      hero.flipping = true;
      sfx('whoosh');
    }
    burst(hero.x, hero.y, '#ffffff', 6);
  }

  // Count the flips when the hero grabs a web, lands, or hits a wall.
  var FLIP_NAMES = ['FLIP!', 'DOUBLE FLIP!', 'TRIPLE FLIP!', 'QUAD FLIP!!', 'MEGA FLIP!!!'];
  function endFlip() {
    if (!hero.flipping) return;
    hero.flipping = false;
    var n = Math.floor((hero.spinAcc + 1.6) / (Math.PI * 2));   // a little bit generous
    // keep the leftover spin so the body smoothly turns back upright
    var r = hero.spin % (Math.PI * 2); if (r > Math.PI) r -= Math.PI * 2; if (r < -Math.PI) r += Math.PI * 2;
    hero.spin = r;
    if (n >= 1) {
      var name = FLIP_NAMES[Math.min(n, FLIP_NAMES.length) - 1];
      trick(25 * n * (n + 1) / 2, name, '#ff9f1c');
      game.stats.bestFlip = Math.max(game.stats.bestFlip, n);
      medal('flip1'); if (n >= 2) medal('flip2'); if (n >= 3) medal('flip3');
      if (n >= 2) say('flip');
      sfx('trick');
    }
  }

  // Style points go through here: multiplied by the multiplier meter, which grows with each trick.
  function trick(points, label, color) {
    var pts = Math.round(points * hero.mult);
    hero.bonus += pts;
    trickPopup(label, pts, color || '#ffd23f');
    hero.mult = Math.min(5, hero.mult + 0.25);
    hero.multTime = 4;
    game.stats.maxMult = Math.max(game.stats.maxMult, hero.mult);
    if (hero.mult >= 5) medal('mult5');
  }

  function touchedSomething() { // landed on a roof or grabbed a wall: combo ends
    endFlip();
    hero.airborne = false;
    hero.combo = 0;
  }

  function hurt(h) {
    if (hero.hurt > 0 || game.state !== 'play' || game.goalDone || hero.zip) return;
    if (hero.webShield > 0) {   // web shield: blocks the hit and webs whatever bumped you
      if (world.hazards.indexOf(h) >= 0 && !h.webbed) webEnemy(h);
      burst(hero.x, hero.y, '#d9ffe9', 10); sfx('pop'); hero.hurt = 0.3;
      return;
    }
    if (h.isBoss) { h.x -= 350; } else if (!h.keep) h.dead = true;
    burst(h.x, h.y, '#cfd6e6', 14);
    shake(0.35, 14);
    hero.vy = Math.min(hero.vy, -380);   // bounce up so you can recover
    if (hero.shield) {
      hero.shield = false; hero.hurt = 0.8;
      popup(hero.x, hero.y - 50, 'SHIELD SAVED YOU!', '#7df9ff'); sfx('shield');
      return;
    }
    hero.hurt = TUNING.hurtTime * diffCfg().hurt;
    if (DEBUG_GOD) return;
    hero.hearts--;
    game.heartsLost++;
    buzz(80);
    if (world.finalBoss) world.finalBoss.lostHeart = true;
    endFlip();
    sfx('hit');
    say('hit', true);
    if (hero.hearts <= 0) gameOver('hearts');
  }

  function collect() {
    var R = TUNING.heroRadius + 14;
    for (var i = world.stars.length - 1; i >= 0; i--) {
      var s = world.stars[i];
      if (Math.abs(s.x - hero.x) < R && Math.abs(s.y - hero.y) < R + 10) {
        world.stars.splice(i, 1);
        hero.stars++;
        hero.streak = hero.streakTime > 0 ? hero.streak + 1 : 1;
        hero.streakTime = 0.8;
        if (hero.streak === 5) say('stars');
        burst(s.x, s.y, '#ffd23f', 6);
        shake(0.05, 1.5);
        sfx('star');
      }
    }
    for (var j = world.pickups.length - 1; j >= 0; j--) {
      var p = world.pickups[j];
      if (Math.hypot(p.x - hero.x, p.y - hero.y) < R + 10) {
        world.pickups.splice(j, 1);
        if (p.type === 'boost') { hero.boost = TUNING.boostTime; hero.vx = Math.max(hero.vx, 0) + 350; popup(p.x, p.y - 40, 'SPEED BOOST!', '#7df9ff'); sfx('boost'); }
        if (p.type === 'shield') { hero.shield = true; popup(p.x, p.y - 40, 'SHIELD!', '#7df9ff'); sfx('shield'); }
        if (p.type === 'heart') {
          if (hero.hearts < maxHearts()) { hero.hearts++; popup(p.x, p.y - 40, '+1 HEART', '#ff6b8b'); }
          else { hero.bonus += 25; popup(p.x, p.y - 40, '+25', '#ff6b8b'); }
          sfx('shield');
        }
        burst(p.x, p.y, '#7df9ff', 12);
      }
    }
    for (var k = 0; k < world.hazards.length; k++) {
      var h = world.hazards[k];
      if (!h.dead && !h.webbed && Math.hypot(h.x - hero.x, h.y - hero.y) < h.r + TUNING.heroRadius - 4) hurt(h);
    }
    world.hazards = world.hazards.filter(function (h) { return !h.dead; });
    var b = world.boss;
    if (b && !b.leaving && Math.hypot(b.x - hero.x, b.y - hero.y) < b.r + TUNING.heroRadius - 6) { b.isBoss = true; hurt(b); }
  }

  function stepHero(dt) {
    var R = TUNING.heroRadius;
    var prevX = hero.x, prevY = hero.y;
    if (hero.hurt > 0) hero.hurt -= dt;
    if (hero.boost > 0) hero.boost -= dt;
    if (hero.roll > 0) hero.roll -= dt;
    if (stepZip(dt)) return;

    if (hero.climbing) {   // WALL RUN: sprint up the wall, then vault over the top with a flip
      var cb = hero.climbing;
      hero.climbV = Math.min(TUNING.climbSpeed * 1.9, (hero.climbV || TUNING.climbSpeed) + 900 * dt);
      hero.vx = 0; hero.vy = -hero.climbV;
      hero.y += hero.vy * dt;
      hero.runPhase += dt * 18;
      if (Math.random() < 0.3) particles.push({ x: hero.x + hero.climbSide * 10, y: hero.y + 20, vx: rand(-20, 20), vy: rand(20, 60), life: 0.3, color: '#cfd6e6', g: 0 });
      if (hero.y + R < cb.top) {
        hero.climbing = null; hero.vy = -420; hero.vx = 330; hero.climbV = 0;
        if (cb.top < GROUND_Y - 200) {
          hero.flipDir = 1; hero.spinRate = 15; hero.spinAcc = 0; hero.flipping = true;
          popup(hero.x, hero.y - 50, 'WALL RUN!', '#7df9ff'); sfx('whoosh');
        }
      }
      return;
    }

    hero.vy += TUNING.gravity * dt;
    if (hero.flying) flyPhysics(dt);

    if (hero.rope) {
      hero.rope.age += dt;
      var a = hero.rope.anchor;
      var nx = hero.x - a.x, ny = hero.y - a.y;
      var L = Math.hypot(nx, ny) || 1;
      nx /= L; ny /= L;
      if (ny > 0) {
        var tx = -ny, ty = nx;
        if (tx < 0) { tx = -tx; ty = -ty; }
        var pump = TUNING.swingPump + (hero.boost > 0 ? TUNING.boostPush : 0);
        hero.vx += tx * pump * dt;
        hero.vy += ty * pump * dt;
      }
      var ang = Math.atan2(nx, ny);
      hero.rope.sweep += Math.abs(ang - hero.rope.lastAng);
      // whoosh through the bottom of the arc -> speed kick (once per swing)
      if (!hero.rope.kicked && hero.rope.lastAng < 0 && ang >= 0 && hero.vx > 0) {
        hero.rope.kicked = true;
        var spd = Math.hypot(hero.vx, hero.vy) || 1;
        hero.vx += hero.vx / spd * TUNING.bottomKick; hero.vy += hero.vy / spd * TUNING.bottomKick;
        for (var q = 0; q < 6; q++) particles.push({ x: hero.x, y: hero.y + 10, vx: -hero.vx * rand(0.1, 0.3), vy: rand(-40, 40), life: 0.3, color: '#ffffff', g: 0, kind: 'line' });
      }
      hero.rope.lastAng = ang;
    } else if (hero.onRoof) {
      hero.vx += (TUNING.runSpeed - hero.vx) * Math.min(1, 4 * dt);
      hero.runPhase += dt * 14;
    } else if (hero.boost > 0) {
      hero.vx += TUNING.boostPush * 0.5 * dt;
    }
    if (hero.flipping) {
      var dSpin = hero.spinRate * dt;
      hero.spin += dSpin * hero.flipDir;
      hero.spinAcc += dSpin;
    } else if (hero.spin) {
      hero.spin *= Math.max(0, 1 - dt * 10);            // turn back upright
      if (Math.abs(hero.spin) < 0.01) hero.spin = 0;
    }

    var maxS = hero.boost > 0 ? TUNING.boostMaxSpeed : TUNING.maxSpeed;
    var sp = Math.hypot(hero.vx, hero.vy);
    if (sp > maxS) { hero.vx *= maxS / sp; hero.vy *= maxS / sp; }

    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;

    if (hero.rope) {
      var an = hero.rope.anchor;
      var dx = hero.x - an.x, dy = hero.y - an.y;
      var dist = Math.hypot(dx, dy) || 1;
      var rest = hero.rope.length, maxL = rest * (1 + TUNING.ropeStretch);
      if (dist > rest) {   // springy web: stretches a little, then pulls back
        var ux = dx / dist, uy = dy / dist;
        var pull = TUNING.ropeSpring * (dist - rest) * dt;
        var radial = hero.vx * ux + hero.vy * uy;
        hero.vx -= ux * (pull + radial * Math.min(1, 8 * dt));
        hero.vy -= uy * (pull + radial * Math.min(1, 8 * dt));
        if (dist > maxL) {
          hero.x = an.x + ux * maxL;
          hero.y = an.y + uy * maxL;
          radial = hero.vx * ux + hero.vy * uy;
          if (radial > 0) { hero.vx -= ux * radial; hero.vy -= uy * radial; }
        }
      }
    }

    hero.onRoof = false;
    for (var i = 0; i < world.buildings.length; i++) {
      var b = world.buildings[i];
      if (hero.x + R * 0.6 < b.x || hero.x - R * 0.6 > b.x + b.w || hero.y + R < b.top) continue;
      if (prevY + R <= b.top + 4 && hero.vy >= 0) {
        if (hero.airborne || hero.vy > 300) hero.squash = 1;
        if (hero.vy > 650 && currentCharacter().smash) redSmash();
        if (hero.airborne && hero.vy > 520 && hero.vx > 260 && hero.roll <= 0 && !hero.flipping) {   // parkour roll
          hero.roll = 0.42; hero.vx = Math.max(hero.vx, 420);
          popup(hero.x, hero.y - 50, 'ROLL!', '#ffffff'); sfx('roll'); hero.bonus += 5;
        }
        if (hero.airborne && zfx.rain > 0.5) for (var sp2 = 0; sp2 < 8; sp2++) particles.push({ x: hero.x + rand(-14, 14), y: b.top - 2, vx: rand(-160, 160), vy: rand(-260, -80), life: 0.4, color: 'rgba(190,215,255,0.9)', g: 900 });
        hero.y = b.top - R; hero.vy = 0; hero.onRoof = true;
        if (hero.airborne) touchedSomething();
      } else {
        hero.rope = null;
        hero.climbing = b; hero.climbV = Math.max(TUNING.climbSpeed, hero.vx * 0.6);
        hero.climbSide = prevX < b.x + b.w / 2 ? 1 : -1;
        hero.x = prevX < b.x + b.w / 2 ? b.x - R * 0.6 : b.x + b.w + R * 0.6;
        hero.vx = 0;
        touchedSomething();
        sfx('grab');
      }
    }
    if (!hero.onRoof && !hero.rope) {
      for (var j = 0; j < world.buildings.length; j++) {
        var bb = world.buildings[j];
        if (hero.x >= bb.x && hero.x <= bb.x + bb.w && Math.abs(hero.y + R - bb.top) < 1) hero.onRoof = true;
      }
    }
    if (!hero.onRoof && !hero.rope && !hero.climbing) hero.airborne = true;

    hero.maxX = Math.max(hero.maxX, hero.x);

    var target;
    if (hero.rope) target = Math.atan2(hero.rope.anchor.y - hero.y, hero.rope.anchor.x - hero.x) + Math.PI / 2;
    else if (hero.onRoof) target = 0;
    else target = clamp(hero.vx / 900, -0.6, 0.6) + clamp(hero.vy / 1500, -0.4, 0.4);
    hero.angle += (target - hero.angle) * Math.min(1, dt * 12);

    if (hero.streakTime > 0) hero.streakTime -= dt;
    if (hero.stretch > 0) hero.stretch = Math.max(0, hero.stretch - dt * 4);
    if (hero.squash > 0) hero.squash = Math.max(0, hero.squash - dt * 5);
    if (hero.boost > 0 && Math.random() < 0.6) {
      particles.push({ x: hero.x - 10, y: hero.y + rand(-10, 10), vx: -hero.vx * 0.2, vy: rand(-30, 30), life: 0.35, color: ['#ff3b3b', '#ffd23f', '#7df9ff', '#4f8bff'][Math.floor(Math.random() * 4)], g: 0 });
    }
  }

  /* =====================================================================
   * WEB SHOOTERS  - web balls that wrap up enemies and hurt bosses
   * =================================================================== */
  function fireButtonRect() {
    var r = clamp(Math.min(screenW, screenH) * 0.11, 36, 54);
    return { cx: screenW - safe.right - r - 16, cy: screenH - safe.bottom - r - 16, r: r };
  }
  function onFireButton(x, y) { var f = fireButtonRect(); return Math.hypot(x - f.cx, y - f.cy) < f.r * 1.3; }

  function enemyTargets() {
    var list = [];
    world.hazards.forEach(function (h) { if (!h.webbed && !h.dead && (h.type !== 'runner' || h.active)) list.push({ x: h.x, y: h.y, vx: h.type === 'bird' ? -h.speed : h.type === 'runner' ? (h.vx || 0) : 0, vy: h.type === 'runner' && !h.onB ? (h.vy || 0) : 0 }); });
    var cr = world.crab;
    if (cr && cr.state === 'fight') list.push({ x: cr.x, y: cr.y, vx: 0, vy: 0, big: true });
    var b = world.boss;
    if (b && !b.leaving) list.push({ x: b.x, y: b.y, vx: 0, vy: 0 });
    var fb = world.finalBoss;
    if (fb && fb.state === 'fight') { var c = fbBodyCenter(fb); list.push({ x: c.x, y: c.y, vx: 0, vy: 0, big: true }); }
    world.bolts.forEach(function (z) { list.push({ x: z.x, y: z.y, vx: z.vx, vy: z.vy, bolt: true }); });
    return list;
  }

  function fireWeb() {
    if (game.state !== 'play' || game.tutorial) return;
    if (hero.fireCool > 0) return;
    if (hero.ammo < 1) { sfx('empty'); return; }
    hero.ammo -= 1; hero.fireCool = TUNING.fireCooldown;
    var hd = heroHand(), best = null, bestD = 820;
    enemyTargets().forEach(function (t) {
      if (t.x < hero.x - 60) return;                       // only aim ahead (or right above)
      var d = Math.hypot(t.x - hd.x, t.y - hd.y) - (t.bolt ? 120 : 0) - (t.big ? 60 : 0);
      if (d < bestD) { bestD = d; best = t; }
    });
    var dx = 1, dy = -0.12;
    if (best) {
      var lead = Math.hypot(best.x - hd.x, best.y - hd.y) / TUNING.webBallSpeed;
      dx = best.x + best.vx * lead - hd.x; dy = best.y + best.vy * lead - hd.y;
    }
    var L = Math.hypot(dx, dy) || 1;
    var me = currentCharacter();
    world.webBalls.push({ x: hd.x, y: hd.y, vx: dx / L * TUNING.webBallSpeed + hero.vx * 0.25, vy: dy / L * TUNING.webBallSpeed, life: 0.9, spin: 0, heart: !!me.hearts, kase: me.shot === 'case', ice: me.shot === 'ice', look: me.shot });
    game.stats.shots++;
    shake(0.04, 1.5);
    sfx('shoot');
  }

  function hitStop(t) { game.hitStop = Math.max(game.hitStop, t); }

  function webEnemy(h, charm) {
    h.webbed = true; h.vy = -160; h.rot = 0; h.wt = 0;
    if (charm === 'ice') {   // freeze shot: the enemy turns into an ice block and drops
      h.frozen = true; h.vy = 0; h.rot = 0;
      buzz(10); game.stats.webbed++; if (game.stats.webbed >= 10) medal('web10'); hero.stars++;
      trick(h.type === 'goon' || h.type === 'saw' ? 20 : 10, (h.type ? h.type.toUpperCase() + ' ' : '') + 'FROZEN!', '#9fe8ff');
      for (var ic = 0; ic < 10; ic++) particles.push({ x: h.x, y: h.y, vx: rand(-200, 200), vy: rand(-220, 60), life: 0.5, color: ic % 2 ? '#ffffff' : '#9fe8ff', g: 500 });
      hitStop(0.05); shake(0.08, 3); sfx('pop');
      if (Math.random() < 0.3) say('freeze');
      return;
    }
    if (charm) {   // heart blast: no web, just a happy enemy floating away on a heart balloon
      h.charmed = true; h.vy = -60; h.ally = charm === 'charm';   // charmed by her: it fights FOR her for a moment
      buzz(10); game.stats.webbed++; if (game.stats.webbed >= 10) medal('web10'); hero.stars++;
      trick(h.type === 'goon' || h.type === 'saw' ? 20 : 10, CHARM_NAMES[h.type] || 'CHARMED!', '#ff8ab3');
      for (var c = 0; c < 6; c++) loveFx.list.push({ x: h.x, y: h.y, vx: rand(-140, 140), vy: rand(-160, 20), life: 0.8, max: 0.8, r: rand(6, 10), ci: c, seed: c });
      hitStop(0.05); shake(0.08, 3); sfx('pop');
      return;
    }
    if (h.type === 'goon') { h.vx = -60; h.vy = -60; }
    if (h.type === 'runner') { h.vy = 0; if (h.onB) h.y = h.onB.top - 14; }
    if (h.type === 'saw') for (var q = 0; q < 12; q++) particles.push({ x: h.x, y: h.y, vx: rand(-260, 260), vy: rand(-260, 40), life: 0.4, color: '#ffd23f', g: 700 });
    buzz(10);
    game.stats.webbed++;
    if (game.stats.webbed >= 10) medal('web10');
    hero.stars++;
    trick(h.type === 'goon' || h.type === 'saw' ? 20 : 10, h.bat ? 'BAT WEBBED!' : (WEBBED_NAMES[h.type] || 'WEBBED!'), '#ffffff');
    burst(h.x, h.y, '#ffffff', 12, 'confetti');
    hitStop(0.06);
    shake(0.12, 4);
    sfx('pop');
  }

  function stepWebBalls(dt) {
    for (var i = world.webBalls.length - 1; i >= 0; i--) {
      var w = world.webBalls[i], hit = false;
      w.life -= dt; w.vy += 300 * dt; w.x += w.vx * dt; w.y += w.vy * dt; w.spin += dt * 12;
      var wr = w.mega ? 40 : 16, dmg = w.mega ? 4 : 1;
      for (var j = 0; j < world.hazards.length && (!hit || w.mega); j++) {   // mega web goes through and wraps everything
        var h = world.hazards[j];
        if (!h.webbed && Math.hypot(h.x - w.x, h.y - w.y) < h.r + wr) { webEnemy(h, w.heart ? 'charm' : w.ice ? 'ice' : null); if (!w.mega) hit = true; }
      }
      for (var k = world.bolts.length - 1; k >= 0 && (!hit || w.mega); k--) {
        var z = world.bolts[k];
        if (Math.hypot(z.x - w.x, z.y - w.y) < wr + 14) {
          if (w.ice) {   // freeze shot: enemy shots / lightning freeze in mid-air, then shatter
            if (z.frozen > 0) continue;
            z.frozen = 1.6; trick(5, 'ICE BLOCK!', '#9fe8ff'); burst(z.x, z.y, '#9fe8ff', 8); sfx('pop'); if (!w.mega) hit = true; continue;
          }
          world.bolts.splice(k, 1);
          trick(5, z.kind === 'bubble' ? 'BUBBLE POPPED!' : z.kind === 'nut' ? 'NUT BLOCKED!' : z.kind === 'case' ? 'CASE BLOCKED!' : z.kind === 'plane' ? 'PLANE GRABBED!' : z.kind === 'ice' ? 'ICE SMASHED!' : z.kind === 'hbomb' ? 'HEART BOMB STOPPED!' : z.kind === 'spot' ? 'SPOT BLOCKED!' : z.kind === 'car' ? 'CAR CAUGHT!' : z.kind === 'chunk' ? 'ROCK STOPPED!' : 'ZAP BLOCKED!', '#ffd23f');
          burst(z.x, z.y, z.kind === 'bubble' ? '#bff4ff' : '#ffd23f', 10); sfx('pop'); if (!w.mega) hit = true;
        }
      }
      var cr = world.crab;
      if (!hit && cr && cr.state === 'fight' && Math.hypot(cr.x - w.x, cr.y - w.y) < (cr.agent ? 85 : 62) + wr) { hit = true; damageCrab(cr, w, dmg); }
      var b = world.boss;
      if (!hit && b && !b.leaving && Math.hypot(b.x - w.x, b.y - w.y) < b.r + 10 + (w.mega ? 24 : 0)) {
        hit = true; b.hp -= w.mega ? 3 : 1; b.x -= 70; b.flash = 0.12; hitStop(0.04); sfx('bonk'); burst(w.x, w.y, '#ffffff', 8);
        if (b.hp <= 0) {
          b.leaving = true; world.nextBossX = hero.x + TUNING.bossEvery;
          game.bigbotWebbed = true; game.bigbotDone = true;
          var bnm = !game.level && villain ? villain.name.toUpperCase() : 'BIG BOT';
          trick(100, bnm + ' WEBBED!', '#ffd23f'); banner('YOU WEBBED ' + bnm + '!', '#ffd23f'); medal('bigbot');
          burst(b.x, b.y, '#ffffff', 30, 'confetti'); shake(0.3, 8);
        }
      }
      var fb = world.finalBoss;
      if (!hit && fb && fb.state === 'fight') {
        var c = fbBodyCenter(fb);
        if (Math.hypot(c.x - w.x, c.y - w.y) < fb.size * 0.27 + (w.mega ? 24 : 0)) { hit = true; damageFinalBoss(fb, w, dmg); }
      }
      if (w.mega && Math.random() < 0.8) particles.push({ x: w.x, y: w.y, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.3, color: '#b18cff', g: 0 });
      if (hit || w.life <= 0 || w.y > GROUND_Y) {
        if (hit) burst(w.x, w.y, w.heart ? '#ff8ab3' : w.mega ? '#b18cff' : '#ffffff', w.mega ? 18 : 6);
        world.webBalls.splice(i, 1);
      }
    }
  }

  /* =====================================================================
   * FINAL BOSS FIGHT  - the Scribble King
   *   intro (flies in) -> fight (3 phases) -> dying (celebration)
   * =================================================================== */
  function fbK(fb) { return fb.size / FINAL_BOSS.whole[0]; }
  // world position of a point (ix,iy) inside a part picture
  function fbPoint(fb, partName, ix, iy) {
    var P = FINAL_BOSS.parts[partName], k = fbK(fb), W = FINAL_BOSS.whole;
    var ang = fb.angles[partName] || 0;
    var lx = ix, ly = iy;
    if (P.px !== undefined) {
      var dx = ix - P.px, dy = iy - P.py, c = Math.cos(ang), s = Math.sin(ang);
      lx = P.px + dx * c - dy * s; ly = P.py + dx * s + dy * c;
    }
    return { x: fb.x + (P.x + lx - W[0] / 2) * k, y: fb.y + (P.y + ly - W[1] / 2) * k };
  }
  function fbBodyCenter(fb) { var B = FINAL_BOSS.parts.body; return fbPoint(fb, 'body', B.w / 2, B.h / 2); }
  function fbPod(fb, arm) { var P = FINAL_BOSS.parts[arm]; return fbPoint(fb, arm, P.pod[0], P.pod[1]); }

  function bossSay(kind) {
    var list = FINAL_BOSS.lines[kind];
    if (!list) return;
    var line = list[Math.floor(Math.random() * list.length)];
    game.bossTalk = { text: line, life: 2.4 };
    speak(line, FINAL_BOSS.voice);
  }

  function startFinalBoss() {
    var level = game.stats.bosses + 1;
    var hp = DEBUG_BOSSHP || (FINAL_BOSS.hp + (level - 1) * 10);
    world.finalBoss = { x: cam.x + viewW + 400, y: cam.y + viewH * 0.2, size: 300, hp: hp, maxHp: hp, phase: 1, level: level,
                        t: 0, state: 'intro', stateT: 0, next: 2.2, attack: null, flash: 0, angles: {}, lostHeart: false, talkCool: 0, swipe: null };
    world.hazards = [];
    world.boss = null;
    hero.hearts = maxHearts(); hero.shield = true;      // power up for the big fight!
    banner('FINAL BOSS: ' + FINAL_BOSS.name + '!', '#ff3b3b');
    music.track = 'boss';
    shake(0.8, 10);
    sfx('roar');
    setTimeout(function () { if (world.finalBoss) bossSay('intro'); }, 700);
  }

  function damageFinalBoss(fb, w, dmg) {
    dmg = dmg || 1;
    fb.hp = Math.max(0, fb.hp - dmg); fb.flash = 0.1; buzz(12);
    hitStop(0.035); shake(0.08, 3); sfx('bonk');
    burst(w.x, w.y, '#b18cff', 8);
    popup(w.x, w.y - 20, '-' + dmg, '#ffffff');
    fb.talkCool -= 1;
    if (fb.talkCool <= 0 && Math.random() < 0.35) { bossSay('hurt'); fb.talkCool = 5; }
    var frac = fb.hp / fb.maxHp;
    var newPhase = frac <= 0.33 ? 3 : frac <= 0.66 ? 2 : 1;
    if (newPhase > fb.phase) {
      fb.phase = newPhase; fb.attack = null; fb.next = 1.4;
      banner(newPhase === 2 ? FINAL_BOSS.name + ' IS MAD!' : FINAL_BOSS.name + ' IS FURIOUS!', '#ff3b3b');
      bossSay('phase' + newPhase); shake(0.6, 9); sfx('roar');
      world.bolts = [];
    }
    if (fb.hp <= 0) {
      fb.state = 'dying'; fb.stateT = 0; fb.attack = null; world.bolts = [];
      bossSay('defeat'); sfx('roar');
    }
  }

  function bossAttack(fb) {
    var p = fb.phase, r = Math.random();
    if (p >= 3 && r < 0.35) {
      var xs = [];
      for (var i = 0; i < 3 + fb.level; i++) xs.push(hero.x + 120 + i * rand(110, 160));
      return { type: 'rain', t: 0, tele: 1.0, xs: xs };
    }
    if (p >= 2 && r < 0.45) return { type: 'swipe', t: 0, tele: 0.9, dur: 0.6, back: 0.7 };
    var arms = p === 1 ? [Math.random() < 0.5 ? 'armL' : 'armR'] : ['armL', 'armR'];
    return { type: 'bolt', t: 0, tele: 0.75, arms: arms, spread: p >= 3 };
  }

  function fireBolt(from, tx, ty, speed, spreadAng) {
    var a = Math.atan2(ty - from.y, tx - from.x) + (spreadAng || 0);
    world.bolts.push({ x: from.x, y: from.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 3, seed: Math.random() * 100 });
  }

  function stepFinalBoss(dt) {
    var fb = world.finalBoss;
    if (!fb) {
      if (game.state === 'play' && hero.x > world.nextFinalBossX && !world.crab) startFinalBoss();
      return;
    }
    fb.t += dt; fb.stateT += dt;
    if (fb.flash > 0) fb.flash -= dt;
    fb.size = clamp(Math.min(viewW * 0.55, viewH * 0.45), 230, 380);
    var homeX = cam.x + viewW * 0.74, homeY = Math.max(GROUND_Y - 600, cam.y + viewH * 0.3);
    homeY = Math.min(GROUND_Y - 230, Math.max(homeY, bossTopY(fb.size * FINAL_BOSS.whole[1] / FINAL_BOSS.whole[0] * 0.42)));   // stay under the health bar
    homeY += Math.sin(fb.t * 1.7) * 25;
    // idle wiggles
    var wig = fb.phase * 0.08;
    fb.angles.armL = Math.sin(fb.t * 2.2) * (0.15 + wig);
    fb.angles.armR = Math.sin(fb.t * 2.2 + 1.5) * (0.15 + wig);
    fb.angles.legL = Math.sin(fb.t * 3) * 0.3;
    fb.angles.legR = Math.sin(fb.t * 3 + 2) * 0.3;

    if (fb.state === 'intro') {
      fb.x += (homeX - fb.x) * Math.min(1, dt * 1.5);
      fb.y += (homeY - fb.y) * Math.min(1, dt * 1.5);
      if (fb.stateT > 2.6) { fb.state = 'fight'; fb.stateT = 0; say('fight', true); }
      return;
    }
    if (fb.state === 'dying') {
      fb.x += Math.sin(fb.t * 60) * 3; fb.y += 20 * dt;
      if (Math.random() < 0.5) { var c0 = fbBodyCenter(fb); burst(c0.x + rand(-80, 80), c0.y + rand(-80, 80), ['#ff3b3b', '#ffd23f', '#4f8bff', '#3ddc84', '#b18cff'][Math.floor(Math.random() * 5)], 6, 'confetti'); }
      shake(0.1, 5);
      if (fb.stateT > 2.4) bossDefeated(fb);
      return;
    }
    // ---- fight
    var a = fb.attack;
    if (!a) {
      fb.x += (homeX - fb.x) * Math.min(1, dt * 3);
      fb.y += (homeY - fb.y) * Math.min(1, dt * 3);
      fb.next -= dt;
      if (fb.next <= 0) {
        fb.attack = bossAttack(fb);
        if (Math.random() < 0.15) bossSay('taunt');
      }
    } else {
      a.t += dt;
      var speedUp = 1 + (fb.level - 1) * 0.12;
      if (a.type === 'bolt') {
        fb.x += (homeX - fb.x) * Math.min(1, dt * 3); fb.y += (homeY - fb.y) * Math.min(1, dt * 3);
        a.arms.forEach(function (arm) { fb.angles[arm] = (arm === 'armL' ? 0.35 : -0.35) + Math.sin(fb.t * 40) * 0.05 * (a.t / a.tele); });
        if (a.t >= a.tele && !a.fired) {
          a.fired = true;
          a.arms.forEach(function (arm) {
            var pod = fbPod(fb, arm), sp = (380 + fb.phase * 60) * speedUp;
            fireBolt(pod, hero.x + hero.vx * 0.3, hero.y, sp, 0);
            if (a.spread) { fireBolt(pod, hero.x, hero.y, sp, 0.28); fireBolt(pod, hero.x, hero.y, sp, -0.28); }
          });
          sfx('zap'); shake(0.1, 3);
        }
        if (a.t > a.tele + 0.4) endAttack(fb);
      } else if (a.type === 'swipe') {
        if (a.t < a.tele) {       // wind up: arms up, shaking
          fb.angles.armL = 0.6 + Math.sin(fb.t * 50) * 0.08; fb.angles.armR = -0.6 - Math.sin(fb.t * 50) * 0.08;
          fb.x += (homeX + 40 - fb.x) * Math.min(1, dt * 3); fb.y += (homeY - fb.y) * Math.min(1, dt * 3);
          a.tx = hero.x + 60; a.ty = hero.y - 40;      // aims where you are at the end of the wind up
        } else if (a.t < a.tele + a.dur) {    // SWIPE!
          if (!a.swung) { a.swung = true; sfx('whoosh'); shake(0.2, 5); }
          var f = (a.t - a.tele) / a.dur;
          fb.angles.armL = 0.6 - f * 1.8; fb.angles.armR = -0.6 + f * 1.8;
          fb.x += (a.tx - fb.x) * Math.min(1, dt * 7 * speedUp); fb.y += (a.ty - fb.y) * Math.min(1, dt * 7 * speedUp);
          // arms and body hurt
          var hits = [fbBodyCenter(fb), fbPod(fb, 'armL'), fbPod(fb, 'armR')];
          for (var i = 0; i < hits.length; i++) {
            if (Math.hypot(hits[i].x - hero.x, hits[i].y - hero.y) < (i === 0 ? fb.size * 0.25 : 30) + TUNING.heroRadius) { hurt({ x: hero.x, y: hero.y, keep: true }); break; }
          }
        } else {
          fb.x += (homeX - fb.x) * Math.min(1, dt * 3); fb.y += (homeY - fb.y) * Math.min(1, dt * 3);
          if (a.t > a.tele + a.dur + a.back) endAttack(fb);
        }
      } else if (a.type === 'rain') {
        fb.x += (homeX - fb.x) * Math.min(1, dt * 3); fb.y += (homeY - fb.y) * Math.min(1, dt * 3);
        fb.angles.armL = 0.7; fb.angles.armR = -0.7;
        if (a.t >= a.tele && !a.fired) {
          a.fired = true;
          a.xs.forEach(function (x) { world.bolts.push({ x: x, y: cam.y - 40, vx: 0, vy: 900, life: 2, seed: Math.random() * 100, rain: true }); });
          sfx('zap'); shake(0.25, 6);
        }
        if (a.t > a.tele + 0.6) endAttack(fb);
      }
    }
    // touching his body always hurts
    var bc = fbBodyCenter(fb);
    if (Math.hypot(bc.x - hero.x, bc.y - hero.y) < fb.size * 0.22 + TUNING.heroRadius) hurt({ x: hero.x, y: hero.y, keep: true });
  }
  function endAttack(fb) {
    fb.attack = null;
    var base = fb.phase === 1 ? 2.3 : fb.phase === 2 ? 1.8 : 1.4;
    fb.next = base / (1 + (fb.level - 1) * 0.15) + rand(0, 0.5);
  }

  function bossDefeated(fb) {
    var c = fbBodyCenter(fb);
    for (var i = 0; i < 6; i++) burst(c.x + rand(-100, 100), c.y + rand(-100, 100), ['#ff3b3b', '#ffd23f', '#4f8bff', '#3ddc84'][i % 4], 16, 'confetti');
    for (var j = 0; j < 24; j++) world.stars.push({ x: hero.x + 150 + j * 45, y: hero.y - 120 + Math.sin(j * 0.6) * 90, spin: j });
    game.stats.bosses++;
    trick(500 * fb.level, 'KING DEFEATED!', '#ffd23f');
    banner('YOU BEAT THE ' + FINAL_BOSS.name + '!', '#ffd23f');
    medal('king'); if (!fb.lostHeart) medal('untouch');
    if (hero.hearts < maxHearts()) hero.hearts++;
    talk.cool = 0; say('win', true);
    shake(0.6, 12); hitStop(0.15);
    sfx('victory');
    world.finalBoss = null;
    game.kingBeaten = true;
    buzz([80, 40, 80, 40, 200]);
    world.nextFinalBossX = game.level ? Infinity : hero.x + FINAL_BOSS.again;
    world.nextHazardX = hero.x + 1200;
    music.track = 'main';
  }

  function stepBolts(dt) {
    for (var i = world.bolts.length - 1; i >= 0; i--) {
      var z = world.bolts[i];
      if (z.frozen > 0) {
        z.frozen -= dt;
        if (z.frozen <= 0) { burst(z.x, z.y, '#9fe8ff', 10); world.bolts.splice(i, 1); }
        continue;
      }
      z.life -= dt; z.x += z.vx * dt; z.y += z.vy * dt;
      if (z.g) z.vy += z.g * dt;
      if (z.kind === 'bubble') z.y += Math.sin(game.time * 6 + z.seed) * 30 * dt;
      var zr = z.kind === 'bubble' ? 14 : z.kind === 'nut' ? 12 : 16;
      if (game.state === 'play' && Math.hypot(z.x - hero.x, z.y - hero.y) < zr + TUNING.heroRadius) {
        if (z.kind === 'spot') { spotSplat(z.x, z.y); world.bolts.splice(i, 1); continue; }   // spots don't hurt: they blot your view and slow you
        if (z.kind === 'bubble') { burst(z.x, z.y, '#bff4ff', 10); sfx('pop'); }
        hurt({ x: z.x, y: z.y, keep: true }); world.bolts.splice(i, 1); continue;

    if (game.state === 'maker') { if (e.code === 'Escape') closeMaker(); return; }   // let him type the name

    if (e.code === 'Escape' && (game.state === 'map' || game.state === 'settings' || game.state === 'shop' || game.state === 'medals')) {
      if (game.state === 'map' && game.mapSel >= 0) game.mapSel = -1; else game.state = 'title';
      return;
    }
    if (e.code === 'Escape' && game.state === 'story') { endStory(); return; }
    if (e.code === 'KeyZ' || e.code === 'KeyC') { if (!e.repeat) usePower(); return; }
    if (game.state === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      var i = characterIndex() + (e.code === 'ArrowLeft' ? -1 : 1);
      selectCharacter(CHARACTERS[(i + CHARACTERS.length) % CHARACTERS.length].id);
      return;
    }
    if (e.code === 'Escape' || e.code === 'KeyP') { pause(game.state === 'play'); return; }
    if (e.code === 'KeyM') { setSound(!game.sound); return; }
    if (e.code === 'KeyF' || e.code === 'KeyX') { if (!e.repeat) startCharge(); return; }
    if (e.code === 'KeyG' && game.state === 'play' && canFly()) { if (!e.repeat) toggleFly(); return; }
    if (WEB_KEYS[e.code]) { e.preventDefault(); if (!e.repeat) press(); }
  });
  window.addEventListener('keyup', function (e) {
    if (game.state === 'maker') return;
    if (e.code === 'KeyF' || e.code === 'KeyX') { releaseCharge(); return; }
    if (WEB_KEYS[e.code]) { e.preventDefault(); release(); }
  });
  document.addEventListener('visibilitychange', function () { input.roles = {}; if (document.hidden) { release(); pause(true); } });

  /* =====================================================================
   * 7. DRAWING
   * =================================================================== */
  var cam = { x: 0, y: 0 };
  var zone = { cur: 0, next: 1, blend: 0, night: 0, index: 0 };
  var sx0 = 0, sy0 = 0; // screen-shake offset (pixels)
  function SX(x) { return ((x - cam.x) * scale + sx0) / uiDiv; }
  function SY(y) { return ((y - cam.y) * scale + sy0) / uiDiv; }
  // UI layer: on big screens the menus/HUD are laid out on a smaller virtual screen (screenW / UI) and drawn
  // scaled up by UI, so every button and label grows together. Input is mapped the same way.
  var uiDiv = 1, uiSaved = null;
  function beginUI() {
    if (UI === 1 || uiSaved) return;
    uiSaved = { w: screenW, h: screenH, t: safe.top, r: safe.right, b: safe.bottom, l: safe.left };
    screenW /= UI; screenH /= UI; safe.top /= UI; safe.right /= UI; safe.bottom /= UI; safe.left /= UI; uiDiv = UI;
    ctx.setTransform(dpr * UI, 0, 0, dpr * UI, 0, 0);
  }
  function endUI() {
    if (!uiSaved) return;
    var s = uiSaved; uiSaved = null;
    screenW = s.w; screenH = s.h; safe.top = s.t; safe.right = s.r; safe.bottom = s.b; safe.left = s.l; uiDiv = 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function withUI(fn) { var was = !!uiSaved; beginUI(); try { return fn(); } finally { if (!was) endUI(); } }

  function updateCamera(dt, snap) {
    var tx = hero.x - viewW * (world.crab || world.finalBoss ? 0.25 : 0.33);   // boss arena: give the boss room
    var groundTop = GROUND_Y + 50 - viewH;
    var ty = Math.min(groundTop, hero.y - viewH * 0.3);
    if (snap) { cam.x = tx; cam.y = ty; return; }
    cam.x += (tx - cam.x) * Math.min(1, dt * 8);
    cam.y += (ty - cam.y) * Math.min(1, dt * 4);
  }

  function drawBackground(t) {
    var img = getImage(SPRITES.background);
    if (img) {
      var h = screenH, w = img.naturalWidth * (h / img.naturalHeight);
      var off = -((cam.x * scale * 0.2) % w);
      for (var x = off; x < screenW; x += w) ctx.drawImage(img, x, 0, w, h);
    } else {
      ctx.drawImage(skyCanvases[ZONES[zone.cur].sky], 0, 0, screenW, screenH);
      if (zone.blend > 0) { ctx.globalAlpha = zone.blend; ctx.drawImage(skyCanvases[ZONES[zone.next].sky], 0, 0, screenW, screenH); ctx.globalAlpha = 1; }
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 - zone.night * 0.25) + ')';
      for (var i = 0; i < 6; i++) {
        var span = screenW + 300;
        var cx = ((hash(i) * span - cam.x * scale * 0.08 + t * 10) % span + span) % span - 150;
        var cy = screenH * (0.08 + hash(i + 10) * 0.35);
        var r = 22 + hash(i + 20) * 26;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 6.283); ctx.arc(cx + r, cy + 6, r * 0.8, 0, 6.283); ctx.arc(cx - r, cy + 8, r * 0.7, 0, 6.283);
        ctx.fill();
      }
    }
    var groundScreen = (GROUND_Y - cam.y) * scale;
    if (world.finalBoss) {   // boss arena: stormy purple sky + lightning flashes
      ctx.fillStyle = 'rgba(70,20,110,0.45)'; ctx.fillRect(0, 0, screenW, screenH);
      if (Math.sin(t * 2.3) > 0.97) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, 0, screenW, screenH); }
    }
    drawZoneBackdrop(t, groundScreen);
    // far skyline silhouettes
    var par = 0.3, bw = 70;
    ctx.fillStyle = zone.night > 0.5 ? 'rgba(20,20,50,0.7)' : 'rgba(40,40,90,0.5)';
    var startI = Math.floor((cam.x * par) / bw) - 1;
    for (var k = startI; k < startI + viewW / bw + 3; k++) {
      var hgt = 180 + hash(k) * 320;
      ctx.fillRect((k * bw - cam.x * par) * scale, groundScreen - hgt * scale * 0.9, (bw - 6) * scale, hgt * scale);
    }
    // the kid's drawn buildings, standing in the city (parallax)
    if (BUILDING_ART.length) {
      var par2 = 0.55, spacing = 300;
      var s0 = Math.floor((cam.x * par2) / spacing) - 1;
      for (var m = s0; m < s0 + viewW / spacing + 3; m++) {
        if (hash(m + 50) < 0.25) continue; // leave some gaps
        var art = getImage(BUILDING_ART[Math.floor(hash(m + 99) * BUILDING_ART.length)]);
        if (!art) continue;
        var bh = (430 + hash(m + 7) * 170) * scale;
        var bwid = bh * art.naturalWidth / art.naturalHeight;
        var bx = (m * spacing + hash(m + 3) * 80 - cam.x * par2) * scale;
        ctx.drawImage(art, bx, groundScreen - bh, bwid, bh);
        if (game.state === 'play') text('art by ' + BUILDING_ARTIST, bx + bwid / 2, groundScreen - bh - 8, Math.max(9, 10 * scale), 'rgba(255,138,179,0.6)', 'center', '800');
      }
      ctx.fillStyle = 'rgba(20,20,60,' + (0.18 + zone.night * 0.4) + ')'; // push them back (darker at night)
      ctx.fillRect(0, 0, screenW, groundScreen);
    }
  }

  function drawBuilding(b) {
    drawBuildingBody(b);
    var x = SX(b.x), w = b.w * scale;
    if (x > screenW || x + w < 0) return;
    drawRoofExtras(b, x, SY(b.top), w);
  }
  function drawBuildingBody(b) {
    var x = SX(b.x), y = SY(b.top);
    var w = b.w * scale, h = (GROUND_Y - b.top) * scale;
    if (x > screenW || x + w < 0) return;
    var img = getImage(SPRITES.building);
    if (img) { ctx.drawImage(img, x, y, w, h); return; }
    ctx.fillStyle = b.color;
    ctx.fillRect(x, y, w, h);
    if (zone.night > 0.05) { ctx.fillStyle = 'rgba(5,8,30,' + (zone.night * 0.55) + ')'; ctx.fillRect(x, y, w, h); }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - 4 * scale, y, w + 8 * scale, 10 * scale);
    // windows: few lit in the day, lots of glowing ones at night
    var litCut = 0.75 - zone.night * 0.5;
    var dark = zone.night > 0.5 ? 'rgba(5,8,25,0.8)' : (zone.cur === 0 && zone.blend < 0.5 ? 'rgba(160,210,255,0.55)' : 'rgba(10,15,40,0.55)');
    var dec = Math.floor(hash(b.seed + 0.5) * 4);
    if (dec === 1) {      // water tower
      var tx = x + w * 0.65, ty = y;
      ctx.fillStyle = '#5a3d2b';
      ctx.fillRect(tx - 12 * scale, ty - 22 * scale, 3 * scale, 22 * scale); ctx.fillRect(tx + 9 * scale, ty - 22 * scale, 3 * scale, 22 * scale);
      ctx.fillStyle = '#8a5a3c'; ctx.fillRect(tx - 15 * scale, ty - 50 * scale, 30 * scale, 30 * scale);
      ctx.beginPath(); ctx.moveTo(tx - 17 * scale, ty - 50 * scale); ctx.lineTo(tx, ty - 62 * scale); ctx.lineTo(tx + 17 * scale, ty - 50 * scale); ctx.fill();
    } else if (dec === 2) { // antenna with a blinking light
      var ax = x + w * 0.3;
      ctx.strokeStyle = '#2b2b3a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, y); ctx.lineTo(ax, y - 55 * scale); ctx.moveTo(ax - 8 * scale, y - 35 * scale); ctx.lineTo(ax + 8 * scale, y - 35 * scale); ctx.stroke();
      if (Math.sin(game.time * 4 + b.seed) > 0) { ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(ax, y - 56 * scale, 3, 0, 6.283); ctx.fill(); }
    }
    var cols = Math.max(2, Math.floor(b.w / 34)), rows = Math.floor((GROUND_Y - b.top - 30) / 38);
    var cw = b.w / cols;
    for (var c = 0; c < cols; c++) {
      for (var r = 0; r < rows; r++) {
        ctx.fillStyle = hash(b.seed + c * 7.3 + r * 13.1) > litCut ? '#ffe28a' : dark;
        ctx.fillRect(x + (c * cw + cw * 0.25) * scale, y + (24 + r * 38) * scale, cw * 0.5 * scale, 20 * scale);
      }
    }
  }

  function drawStreet() {
    var y = SY(GROUND_Y);
    if (y > screenH) return;
    if (zfx.water > 0.5) { drawWater(y, game.time); return; }   // Rainy Docks: the street is the harbour
    ctx.fillStyle = '#2b2b33';
    ctx.fillRect(0, y, screenW, screenH - y + 20);
    // street lamps (glow at night)
    var lampGap = 420, l0 = Math.floor(cam.x / lampGap);
    for (var li = l0; li < l0 + viewW / lampGap + 2; li++) {
      var lx = SX(li * lampGap + 100);
      ctx.fillStyle = '#1b1b24'; ctx.fillRect(lx - 2, y - 70 * scale, 4, 70 * scale); ctx.fillRect(lx - 2, y - 70 * scale, 16 * scale, 4);
      if (zone.night > 0.3) {
        var lg = ctx.createRadialGradient(lx + 14 * scale, y - 66 * scale, 1, lx + 14 * scale, y - 66 * scale, 40 * scale);
        lg.addColorStop(0, 'rgba(255,230,140,' + (0.8 * zone.night) + ')'); lg.addColorStop(1, 'rgba(255,230,140,0)');
        ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx + 14 * scale, y - 66 * scale, 40 * scale, 0, 6.283); ctx.fill();
      }
    }
    ctx.fillStyle = '#f2d14b';
    var dash = 60 * scale, off = -((cam.x * scale) % (dash * 2));
    for (var x = off; x < screenW; x += dash * 2) ctx.fillRect(x, y + 25 * scale, dash, 5 * scale);
  }

  function onScreen(x, y, m) { var a = SX(x), b = SY(y); return a > -m && a < screenW + m && b > -m && b < screenH + m; }

  function drawAnchor(a, t, isTarget) {
    if (!onScreen(a.x, a.y, 60)) return;
    var x = SX(a.x), y = SY(a.y + Math.sin(t * 2 + a.bob) * 3);
    if (isTarget) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(t * 8)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 26 * scale, 0, 6.283); ctx.stroke();
    }
    var img = getImage(SPRITES.anchor);
    if (img) { var s = 34 * scale; ctx.drawImage(img, x - s / 2, y - s / 2, s, s); return; }
    ctx.fillStyle = '#c9cfe0';
    ctx.beginPath(); ctx.ellipse(x, y, 16 * scale, 7 * scale, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x, y, 6 * scale, 0, 6.283); ctx.fill();
  }

  function starPath(x, y, r1, r2, sx) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(x + Math.cos(a) * r * (sx || 1), y + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function drawStar(s, t) {
    if (!onScreen(s.x, s.y, 30)) return;
    var x = SX(s.x), y = SY(s.y), sc = Math.cos(t * 3 + s.spin);
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
    starPath(x, y, 14 * scale, 6 * scale, 0.35 + 0.65 * Math.abs(sc));
    ctx.fill(); ctx.stroke();
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
    ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
    ctx.closePath();
  }
  function boltPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.15, y - s); ctx.lineTo(x - s * 0.5, y + s * 0.1); ctx.lineTo(x - s * 0.05, y + s * 0.1);
    ctx.lineTo(x - s * 0.2, y + s); ctx.lineTo(x + s * 0.5, y - s * 0.15); ctx.lineTo(x + s * 0.05, y - s * 0.15);
    ctx.closePath();
  }

  function drawPickup(p, t) {
    if (!onScreen(p.x, p.y, 40)) return;
    var x = SX(p.x), y = SY(p.y + Math.sin(t * 3) * 6), r = 20 * scale;
    ctx.fillStyle = p.type === 'boost' ? '#1f4fd1' : p.type === 'heart' ? '#ffffff' : 'rgba(125,249,255,0.35)';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.stroke();
    if (p.type === 'boost') { ctx.fillStyle = '#ffd23f'; boltPath(x, y, r * 0.75); ctx.fill(); }
    else if (p.type === 'heart') { ctx.fillStyle = '#ff3b5c'; heartPath(x, y + r * 0.15, r * 0.7); ctx.fill(); }
    else { ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 6.283); ctx.stroke(); }
  }

  function drawHazard(h, t) {
    if (!onScreen(h.x, h.y, 80)) return;
    if (h.charmed) { drawCharmed(h, t); return; }
    if (h.frozen) {
      h.webbed = false; h.frozen = false; drawHazard(h, t); h.webbed = true; h.frozen = true;
      drawIceBlock(SX(h.x), SY(h.y), 34 * scale + 6, t, h.x * 0.01);
      return;
    }
    if (h.minion && !h.webbed) sketchHeart(SX(h.x), SY(h.y) - 38 * scale, 9 * scale + 3, Math.sin(t * 4) * 0.3, 3, 0.95);   // Heart Hugger's minion
    if (drawNewHazard(h, t)) return;
    if (h.webbed) { drawCocoon(h); return; }
    var x = SX(h.x), y = SY(h.y), s = scale;
    if (h.type === 'drone') {
      // grumpy robot drone
      ctx.fillStyle = '#5b6170';
      ctx.fillRect(x - 30 * s, y - 20 * s, 60 * s, 5 * s);
      ctx.fillStyle = 'rgba(220,230,255,0.8)';
      var spin = Math.abs(Math.sin(t * 40));
      ctx.fillRect(x - 38 * s, y - 24 * s, 18 * s * spin + 2, 3 * s);
      ctx.fillRect(x + 20 * s, y - 24 * s, 18 * s * spin + 2, 3 * s);
      ctx.fillStyle = '#8a92a6';
      ctx.beginPath(); ctx.arc(x, y, 20 * s, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath(); ctx.arc(x - 7 * s, y - 2 * s, 5 * s, 0, 6.283); ctx.arc(x + 7 * s, y - 2 * s, 5 * s, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.moveTo(x - 13 * s, y - 11 * s); ctx.lineTo(x - 3 * s, y - 7 * s);
      ctx.moveTo(x + 13 * s, y - 11 * s); ctx.lineTo(x + 3 * s, y - 7 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 6 * s, y + 10 * s); ctx.lineTo(x + 6 * s, y + 10 * s); ctx.stroke();
    } else if (h.bat) {
      // night bat
      var fl = Math.sin(t * 18 + h.t);
      ctx.fillStyle = '#2a1840';
      ctx.beginPath(); ctx.ellipse(x, y, 10 * s, 12 * s, 0, 0, 6.283); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 6 * s, y - 2 * s); ctx.lineTo(x - 34 * s, y - 12 * s - fl * 12 * s); ctx.lineTo(x - 24 * s, y + 4 * s); ctx.lineTo(x - 14 * s, y + 2 * s);
      ctx.moveTo(x + 6 * s, y - 2 * s); ctx.lineTo(x + 34 * s, y - 12 * s - fl * 12 * s); ctx.lineTo(x + 24 * s, y + 4 * s); ctx.lineTo(x + 14 * s, y + 2 * s);
      ctx.fill();
      ctx.fillStyle = '#ffdf4a';
      ctx.beginPath(); ctx.arc(x - 4 * s, y - 4 * s, 2.5 * s, 0, 6.283); ctx.arc(x + 4 * s, y - 4 * s, 2.5 * s, 0, 6.283); ctx.fill();
    } else {
      // cranky bird flying left
      var flap = Math.sin(t * 14 + h.t) * 14 * s;
      ctx.fillStyle = '#3a3550';
      ctx.beginPath(); ctx.ellipse(x, y, 18 * s, 11 * s, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 4 * s, y - 4 * s); ctx.lineTo(x + 10 * s, y - 4 * s); ctx.lineTo(x + 6 * s, y - 14 * s - flap); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(x - 16 * s, y - 6 * s, 9 * s, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffb000';
      ctx.beginPath(); ctx.moveTo(x - 24 * s, y - 8 * s); ctx.lineTo(x - 34 * s, y - 4 * s); ctx.lineTo(x - 24 * s, y - 2 * s); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 18 * s, y - 8 * s, 3 * s, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x - 19 * s, y - 8 * s, 1.5 * s, 0, 6.283); ctx.fill();
    }
  }

  // BIG BOT: a giant grumpy drone that chases you
  function drawBoss(t) {
    var b = world.boss;
    if (!b) return;
    var x = SX(b.x), y = SY(b.y), s = scale * 2.6;
    if (x < -60 * s) { // off screen: warning arrow on the left edge
      var ay = clamp(y, 60, screenH - 60);
      if (Math.sin(t * 12) > -0.2) {
        ctx.fillStyle = '#ff3b3b';
        ctx.beginPath(); ctx.moveTo(8 + safe.left, ay); ctx.lineTo(40 + safe.left, ay - 22); ctx.lineTo(40 + safe.left, ay + 22); ctx.closePath(); ctx.fill();
        text('!', 56 + safe.left, ay, 30, '#ff3b3b');
      }
      return;
    }
    var vimg = !game.level && villain ? getImage('custom:villain') : null;
    if (vimg) {   // the kid's own drawn villain chases you
      var vh = 150 * scale, vw = vh * vimg.naturalWidth / vimg.naturalHeight;
      if (vw > vh * 1.4) { vh *= vh * 1.4 / vw; vw = 150 * scale * 1.4; }
      ctx.save(); ctx.translate(x, y + Math.sin(t * 4) * 6 * scale); ctx.rotate(Math.sin(t * 3) * 0.08);
      if (b.flash > 0) ctx.globalAlpha = 0.5;
      ctx.drawImage(vimg, -vw / 2, -vh / 2, vw, vh);
      ctx.restore();
      if (!b.leaving) text(villain.name.toUpperCase() + '  ' + Math.max(0, Math.ceil(TUNING.bossTime - b.t)), x, y - 95 * scale, Math.max(14, 18 * scale), '#ff3b3b');
      var vbt = game.bossTalk;
      if (vbt && vbt.life > 0 && !world.crab && !world.finalBoss) drawBossTalkAt(x, y - 110 * scale, vbt);
      return;
    }
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    if (b.flash > 0) ctx.globalAlpha = 0.5;
    var spin = Math.abs(Math.sin(t * 30));
    ctx.fillStyle = '#4a5060'; ctx.fillRect(-30, -24, 60, 5);
    ctx.fillStyle = 'rgba(220,230,255,0.85)'; ctx.fillRect(-40, -28, 20 * spin + 2, 3); ctx.fillRect(20, -28, 20 * spin + 2, 3);
    ctx.fillStyle = '#6b7388'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3a3f4e'; ctx.fillRect(-16, 10, 32, 6);
    ctx.fillStyle = '#ff3b3b';
    var glow = 4 + Math.sin(t * 10);
    ctx.beginPath(); ctx.arc(-8, -3, glow, 0, 6.283); ctx.arc(8, -3, glow, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#1b1d26'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-15, -13); ctx.lineTo(-3, -8); ctx.moveTo(15, -13); ctx.lineTo(3, -8); ctx.stroke();
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;  // grabby claws
    ctx.beginPath(); ctx.moveTo(-12, 16); ctx.lineTo(-16, 26 + spin * 2); ctx.moveTo(12, 16); ctx.lineTo(16, 26 + spin * 2); ctx.stroke();
    ctx.restore();
    var left = Math.max(0, Math.ceil(TUNING.bossTime - b.t));
    if (!b.leaving) text('BIG BOT  ' + left, x, y - 80 * scale, Math.max(14, 18 * scale), '#ff3b3b');
  }

  function heroHand() { // where the web leaves the hero (world units)
    var up = TUNING.heroSize * 0.5 - TUNING.heroRadius + TUNING.heroSize * 0.3;
    return { x: hero.x + Math.sin(hero.angle) * up, y: hero.y - Math.cos(hero.angle) * up };
  }

  function drawWeb() {
    if (!hero.rope) return;
    var a = hero.rope.anchor, hd = heroHand(), age = hero.rope.age;
    var hx = SX(hd.x), hy = SY(hd.y), ax = SX(a.x), ay = SY(a.y);
    var k = Math.min(1, age / 0.07);                          // the web shoots out
    ax = hx + (ax - hx) * k; ay = hy + (ay - hy) * k;
    // curve: wobbles right after it sticks, sags a bit when the web is loose

  function drawWebBalls() {
    world.webBalls.forEach(function (w) {
      if (w.heart) { drawHeartBall(w, game.time); return; }
      if (w.kase && !w.mega) { drawCaseBall(w); return; }
      if (w.ice) { drawIceBall(w, game.time); return; }
      if (!w.mega && (w.look === 'spot' || w.look === 'zig' || w.look === 'fist')) { drawVillainShot(w, game.time); return; }
      var x = SX(w.x), y = SY(w.y), r = 9 * scale + 2;

      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#9fb8ff'; ctx.lineWidth = 1.5; ctx.beginPath();

  }

  function drawCocoon(h) {   // an enemy wrapped in web
    var x = SX(h.x), y = SY(h.y), s = scale;

  function drawBolts(t) {
    drawBoltsInner(t);
    world.bolts.forEach(function (z) { if (z.frozen > 0) drawIceBlock(SX(z.x), SY(z.y), 22 * scale + 8, t, z.seed || 0); });
  }
  function drawBoltsInner(t) {
    ctx.lineJoin = 'round';
    world.bolts.forEach(function (z) {
      if (drawShot(z, t)) return;
      var sp = Math.hypot(z.vx, z.vy) || 1, ux = z.vx / sp, uy = z.vy / sp, nx = -uy, ny = ux;

  }

  function drawFinalBoss(t) {
    var fb = world.finalBoss;
    if (!fb) return;
    var k = fbK(fb) * scale, W = FINAL_BOSS.whole;
    var c = fbBodyCenter(fb), cx = SX(c.x), cy = SY(c.y);
    // angry glow behind him (redder each phase)
    var glowR = fb.size * scale * (0.6 + 0.05 * Math.sin(t * 4));
    var g = ctx.createRadialGradient(cx, cy, glowR * 0.2, cx, cy, glowR);
    g.addColorStop(0, fb.phase >= 3 ? 'rgba(255,40,40,0.45)' : fb.phase === 2 ? 'rgba(200,60,255,0.4)' : 'rgba(120,90,255,0.35)');

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, 6.283); ctx.fill();

    if (fb.flash > 0) ctx.globalAlpha = 0.55;
    if (partsOk) {
      ['legL', 'legR', 'armL', 'armR'].forEach(function (n) {
        var P = FINAL_BOSS.parts[n];

        ctx.translate(ox + (P.x + P.px) * k, oy + (P.y + P.py) * k);
        ctx.rotate(fb.angles[n] || 0);
        ctx.drawImage(getImage(P.file), -P.px * k, -P.py * k, P.w * k, P.h * k);

        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 6.283); ctx.fill();

  function drawSpeedLines() {
    var sp = Math.hypot(hero.vx, hero.vy);
    if (game.state !== 'play' || sp < 750) return;
    var a = Math.min(0.5, (sp - 750) / 900), ux = hero.vx / sp, uy = hero.vy / sp;
    ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < 14; i++) {
      var x = Math.random() * screenW, y = Math.random() * screenH, l = rand(40, 120);

    }
    ctx.stroke();
  }

  // Built-in hero (Star Kid), drawn around (0,0), facing right.
  function drawHeroShapes(t, swing, run, palette) {
    var RED = palette ? palette[0] : '#e0262f', BLUE = palette ? palette[1] : '#1f4fd1', DARK = '#151a3a';
    ctx.strokeStyle = BLUE; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-5, 10); ctx.lineTo(-7 - run * 8 - swing * 4, 30);
    ctx.moveTo(5, 10); ctx.lineTo(8 + run * 8 + swing * 8, 28 - swing * 6);
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(-7 - run * 8 - swing * 4, 31, 5.5, 0, 6.283); ctx.arc(8 + run * 8 + swing * 8, 29 - swing * 6, 5.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(0, 2, 13, 15, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.ellipse(0, -1, 9, 12, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    starPath(0, 0, 5, 2.2); ctx.fill();
    ctx.strokeStyle = RED; ctx.lineWidth = 7;
    ctx.beginPath();
    if (swing) { ctx.moveTo(4, -6); ctx.lineTo(4, -30); }
    else { ctx.moveTo(-6, -4); ctx.lineTo(-14 + run * 6, 8); ctx.moveTo(6, -4); ctx.lineTo(14 - run * 6, 6); }
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(0, -22, 12, 0, 6.283); ctx.fill();
    ctx.strokeStyle = DARK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-12, -22); ctx.lineTo(12, -22); ctx.moveTo(0, -34); ctx.lineTo(0, -10); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = DARK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-4, -23, 4, 5.5, -0.3, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(6, -23, 4, 5.5, 0.3, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23f';
    var flap = Math.sin(t * 20) * 3;
    ctx.beginPath(); ctx.moveTo(-8, -13); ctx.lineTo(-24, -14 + flap); ctx.lineTo(-22, -7 + flap); ctx.closePath(); ctx.fill();
  }

  // Draw any character at screen (x,y), "height" pixels tall, rotated by angle.
  function drawCharacter(ch, x, y, height, angle, t, swing, run, palette, sx, sy) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (sx) ctx.scale(sx, sy);
    var img = getImage(ch.file);
    if (img) {
      var bounce = run ? Math.abs(run) * 0.04 : 0;          // little running hop
      var h = height * (1 - bounce), w = height * img.naturalWidth / img.naturalHeight * (1 + bounce);
      if (w > height * 1.3) { h *= height * 1.3 / w; w = height * 1.3; }   // very wide drawings
      ctx.drawImage(img, -w / 2, -h / 2 - (run ? Math.abs(run) * height * 0.05 : 0), w, h);
    } else {
      var k = height / 72;
      ctx.scale(k, k);
      drawHeroShapes(t, swing, run || 0, palette);
    }
    ctx.restore();
  }

  function drawHero(t) {
    if (hero.hurt > 0 && Math.floor(t * 16) % 2 === 0) return; // blink after a hit
    var ch = currentCharacter();
    var size = (ch.size || TUNING.heroSize) * scale;
    drawTrail(t);
    var ang = (hero.climbing ? -0.3 * hero.climbSide : hero.angle) + hero.spin;
    if (hero.roll > 0) ang += (1 - hero.roll / 0.42) * Math.PI * 2;   // parkour roll
    // lift the picture so the feet sit at the bottom of the bump-circle (on the roof)
    var lift = (ch.size || TUNING.heroSize) * 0.5 - TUNING.heroRadius;
    var x = SX(hero.x + Math.sin(ang) * lift), y = SY(hero.y - Math.cos(ang) * lift);
    var aura = equipped('aura');
    if (aura) {
      var g = ctx.createRadialGradient(x, y, size * 0.1, x, y, size * 0.75);
      g.addColorStop(0, aura.value); g.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, size * 0.75, 0, 6.283); ctx.fill();

    var sx = 1 - hero.stretch * 0.18 + hero.squash * 0.2, sy = 1 + hero.stretch * 0.28 - hero.squash * 0.22;
    if (hero.flipping || hero.roll > 0) { sx *= 0.9; sy *= 0.9; }   // tuck into a ball while flipping / rolling
    if (hero.onRoof && !hero.roll) { var br = Math.sin(hero.runPhase * 2) * 0.035; sx *= 1 + br; sy *= 1 - br; }   // running bounce
    var nh = ch.hearts ? 5 + Math.min(5, hero.combo) : 0;
    if (nh) drawLoveHearts(x, y, size, t, nh, 'back');
    drawCharacter(ch, x, y, size, ang, t, hero.rope || hero.zip ? 1 : 0, hero.onRoof || hero.climbing ? Math.sin(hero.runPhase) : 0, suit && suit.value, sx, sy);

  }

  var RAINBOW = ['#ff3b3b', '#ff9f1c', '#ffd23f', '#3ddc84', '#4f8bff', '#9b5de5'];

    var tr = equipped('trail'), pts = hero.trail;
    if (!tr || pts.length < 2) return;
    ctx.lineCap = 'round';
    for (var i = 1; i < pts.length; i++) {
      var k = i / pts.length, a = pts[i - 1], b = pts[i];

      }

  }

  function drawBubble() { // comic speech bubble above the hero

    var fs = Math.max(14, Math.min(20, 18 * scale));

  function text(str, x, y, size, color, align, weight) {

  function roundRect(x, y, w, h, r) {

    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawHUD(t) {
    var s = Math.max(18, Math.min(30, Math.min(screenW, screenH) / 16));
    var L = 14 + safe.left, T = 20 + safe.top;
    text(Math.floor(hero.maxX / 10) + ' m', L, T, s, '#ffffff', 'left');
    // stars
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
    starPath(L + s * 0.45, T + s * 1.25, s * 0.45, s * 0.2); ctx.fill(); ctx.stroke();
    text('' + hero.stars, L + s * 1.05, T + s * 1.25, s * 0.85, '#ffd23f', 'left');

    world.pickups.forEach(function (p) { drawPickup(p, t); });

    drawWeb();
    drawGhost(t);
    drawBuddy(t);
    if (game.state === 'play' || game.state === 'paused' || game.state === 'levelEnd' || (game.state === 'over' && game.overTime < 0.15)) drawHero(t);
    drawLoveFx(t);
    drawWebBalls();
    drawBolts(t);
    drawEffects();
    drawWeather(t);
    drawSpeedLines();
    drawBubble();
    if (game.state === 'play' || game.state === 'paused') drawSplats();
    beginUI();

    if (game.state === 'play') { drawHUD(t); drawCoach(t); drawBanner(); drawToast(); if (game.tutorial) drawTutorial(t); }
    else if (game.state === 'title') drawTitle(t);

      var dx = h.x - hero.x;

    resetWorld(startX);
    resetHero(startX);
    extendWorld(hero.x + viewW + 800);
    particles = []; popups = [];
    updateCamera(0, true);
    game.state = 'play';
    game.newBest = false;
    game.playTime = 0;
    game.zoneIndex = zoneAt(hero.x).index;
    game.banner = null;
    talk.cool = 0; talk.life = 0;
    input.held = swingFingers() > 0;
    game.nextThunder = game.time + rand(3, 6);
    game.tutorial = game.power && !save.tut[game.power] ? game.power : null;
    game.coach = L && game.levelIndex === 0 && (!save.coach || DEBUG_COACH) ? { step: 0, t: 0 } : null;
    if (game.coach) game.tutorial = null;
    loveFx.list = []; loveFx.combo = 0; world.buddies = null;
    spx.traps = []; spx.waves = []; spx.splats = []; spx.wobble = 0; hero.slowT = 0;
    ghostStart();
    if (L) {
      banner('LEVEL ' + (game.levelIndex + 1) + ': ' + L.name.toUpperCase(), '#ffd23f');
      game.goalMsg = { text: 'GOAL: ' + goalText(L), life: 5 };
    } else banner(ZONES[zoneAt(hero.x).cur].name, '#ffffff');
    say('start', true);
  }

  function gameOver(reason) {
    if (game.state !== 'play') return;
    game.state = 'over';
    game.reason = reason;
    game.overTime = 0;
    game.dist = Math.floor(hero.maxX / 10);
    game.lastStars = hero.stars;
    game.lastBonus = hero.bonus;
    game.lastScore = totalScore();
    music.track = 'main';
    world.bolts = [];
    hero.rope = null;
    hero.carry = null; hero.zip = null; hero.charging = false;
    if (!game.level && game.lastScore > game.best) { game.best = game.lastScore; game.newBest = true; store(STORAGE_BEST, game.best); }
    if (!game.level) ghostSaveIfBest();
    bank += hero.stars; saveShop();          // stars go into the shop bank
    talk.cool = 0; say('over', true);
    burst(hero.x, hero.y, '#ff3b3b', 18);
    burst(hero.x, hero.y, '#4f8bff', 12);
    shake(0.4, 16);
    buzz(120);
    if (reason === 'water') { sfx('splash'); for (var q = 0; q < 20; q++) particles.push({ x: hero.x + rand(-20, 20), y: GROUND_Y - 4, vx: rand(-200, 200), vy: rand(-500, -150), life: 0.7, color: 'rgba(170,215,255,0.95)', g: 1000 }); }
    else sfx('crash');
  }

  function update(dt) {
    var realDt = dt;
    game.time += dt;
    if (game.toast) game.toast.life -= dt;
    if (game.bossTalk) game.bossTalk.life -= dt;
    if (game.hitStop > 0 && game.state === 'play') {   // tiny freeze on big hits
      game.hitStop -= dt; stepEffects(dt * 0.3); return;
    }
    if (game.slowmo > 0) { game.slowmo -= dt; dt *= 0.4; }
    // camera zooms out a little when you go fast (or fight the boss)
    var spd = Math.hypot(hero.vx, hero.vy);
    var zt = game.state === 'play' ? 1 - clamp((spd - 600) / 1000, 0, 0.16) - (world.finalBoss ? 0.1 : 0) - (world.crab ? 0.08 : 0) : 1;
    game.zoom += (zt - game.zoom) * Math.min(1, realDt * 1.5);
    applyZoom();
    stepWeather(realDt);
    if (game.goalMsg) game.goalMsg.life -= realDt;
    if (game.state === 'play' && game.tutorial) {   // power how-to card: the game waits
      if (game.shopMsg) game.shopMsg.life -= dt;
      updateCamera(dt, false);
      return;
    }
    if (game.state === 'play') {
      dt *= coachTimeScale();
      game.playTime += dt;
      stepFly(dt);
      stepCharmPull(dt);
      stepSpx(dt);
      stepCoach(dt);
      stepGhost(dt);
      stepPowers(dt);
      if (hero.fireCool > 0) hero.fireCool -= dt;
      if (hero.ammo < TUNING.ammo) hero.ammo = Math.min(TUNING.ammo, hero.ammo + dt / TUNING.ammoRecharge);
      if (hero.multTime > 0) hero.multTime -= dt; else if (hero.mult > 1) hero.mult = Math.max(1, hero.mult - dt * 1.5);
      var meters = hero.maxX / 10;
      if (meters >= 1000) medal('km1');
      if (meters >= 3000) medal('km3');
      if (hero.stars >= 50) medal('stars50');
      if (input.held && !hero.rope) shootWeb();
      var steps = 4, h = dt / steps;
      for (var i = 0; i < steps && game.state === 'play'; i++) {
        stepHero(h);
        if (hero.y + TUNING.heroRadius >= GROUND_Y) {
          hero.y = GROUND_Y - TUNING.heroRadius;
          if (game.goalDone) { hero.vy = -900; hero.vx = Math.max(hero.vx, 300); }   // level already won: bounce, no splat
          else gameOver(zfx.water > 0.5 ? 'water' : 'street');
        }
      }
      if (game.state === 'play') { collect(); checkGoal(); }
      stepWorld(dt);
      // trail positions
      if (!hero.onRoof) hero.trail.push({ x: hero.x, y: hero.y }); else if (hero.trail.length) hero.trail.shift();
      if (hero.trail.length > 18) hero.trail.shift();
      // new zone?
      var z = zoneAt(hero.x);
      if (z.index !== game.zoneIndex) { game.zoneIndex = z.index; banner(ZONES[game.level ? game.level.zone : z.index % ENDLESS_ZONES].name, '#ffffff'); }
      extendWorld(cam.x + viewW + 800);
      pruneWorld(cam.x - 400);
      if (game.state === 'play' && game.goalDone) { game.endT -= realDt; if (game.endT <= 0) finishLevel(); }
    } else if (game.state === 'paused') {
      return;
    } else {
      game.overTime += dt;
      if (game.state === 'story' && game.story) game.story.t += dt;
      if (game.state === 'levelEnd' && game.result) {
        var want = 0;
        for (var k = 0; k < game.result.rating; k++) if (game.overTime > 0.5 + k * 0.45) want = k + 1;
        if (want > game.starsShown) { game.starsShown = want; sfx('perfect'); buzz(20); }
      }
      stepWorld(dt);
    }
    if (talk.life > 0) talk.life -= dt;
    if (talk.cool > 0) talk.cool -= dt;
    if (game.banner) game.banner.life -= dt;
    if (game.shopMsg) game.shopMsg.life -= dt;
    stepEffects(dt);
    stepLoveHearts(dt);
    updateCamera(dt, false);
  }

  // Title screen scenery
  resetWorld();
  resetHero();
  extendWorld(viewW + 1600);
  updateCamera(0, true);

  game.cardPage = Math.floor(characterIndex() / (screenW > screenH ? 5 : 3));   // show the picked hero's page
  if (DEBUG_LEVEL) playLevel(clamp(DEBUG_LEVEL - 1, 0, LEVELS.length - 1), true);

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    perf.frameMs += ((now - last) - perf.frameMs) * 0.05;
    last = now;
    var w0 = performance.now();
    update(dt);
    render(game.time);
    perf.workMs += ((performance.now() - w0) - perf.workMs) * 0.05;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Handy for testing / tinkering in the browser console:  WebSwingCity.hero
  // layout helpers for tests: run in the UI layer and hand back REAL screen pixels (so clicks land right on tablets/desktop)
  function realPx(v) {
    if (typeof v === 'number') return v;
    if (Array.isArray(v)) return v.map(realPx);
    if (v && typeof v === 'object') { var o = {}; for (var k in v) o[k] = /^(x|y|w|h|r|cx|cy|top|bottom|left|right)$/.test(k) && typeof v[k] === 'number' ? v[k] * UI : realPx(v[k]); return o; }
    return v;
  }
  function apiLayout(fn) { return function () { var a = arguments; return realPx(withUI(function () { return fn.apply(null, a); })); }; }
  function apiPress(x, y) { if (x == null) return press(); return withUI(function () { return press(x / UI, y / UI); }); }
  window.WebSwingCity = { popups: function () { return popups; }, game: game, hero: hero, world: world, TUNING: TUNING, CHARACTERS: CHARACTERS,
    start: function () { if (DEBUG_LEVEL) playLevel(clamp(DEBUG_LEVEL - 1, 0, LEVELS.length - 1), true); else startEndless(); }, press: apiPress,
    playLevel: playLevel, openMap: openMap, LEVELS: LEVELS, save: function () { return save; }, showStory: showStory, openMaker: openMaker, maker: maker,
    usePower: usePower, spawnEnemy: spawnEnemy, startCrab: startCrab, mapLayout: apiLayout(mapLayout), mapCardLayout: apiLayout(mapCardLayout), levelEndLayout: apiLayout(levelEndLayout),
    settingsLayout: apiLayout(settingsLayout), citizens: function () { return world.citizens; }, goalProgress: goalProgress, powerButtonRect: apiLayout(powerButtonRect),
    startCharge: startCharge, releaseCharge: releaseCharge, POWERS: POWERS, storyLayout: apiLayout(storyLayout), dismissTutorial: dismissTutorial,
    cutOutDrawing: cutOutDrawing, finishLevel: finishLevel, startEndless: startEndless, release: release, select: selectCharacter, images: images,
    titleLayout: apiLayout(titleLayout), shopLayout: apiLayout(shopLayout), pauseLayout: apiLayout(pauseLayout), pauseButtonRect: apiLayout(pauseButtonRect),
    perf: perf, shop: shop, fire: fireWeb, medals: medals, stats: function () { return game.stats; },
    fireButtonRect: apiLayout(fireButtonRect), overLayout: apiLayout(overLayout), medalsLayout: apiLayout(medalsLayout), view: function () { return { x: cam.x, y: cam.y, w: viewW, h: viewH }; }, talk: talk, zoneAt: zoneAt,
    addStars: function (n) { bank += n; saveShop(); }, getBank: function () { return bank; },
    ROSA: ROSA, loveFx: loveFx, cycleDifficulty: cycleDifficulty, diff: diffCfg, maxHearts: maxHearts, ghost: function () { return game.ghost; },
    ghostRec: function () { return game.ghostRec; }, loadGhost: loadGhost, coach: function () { return game.coach; }, buddy: function () { return world.buddies; }, scale: function () { return scale; }, ui: function () { return UI; },
    toggleFly: toggleFly, FLY: FLY, HEARTB: HEARTB, bossSkin: bossSkin, EXTRA_HEROES: EXTRA_HEROES,
    STORIES: STORIES, startGame: startGame };
})();

</script>
